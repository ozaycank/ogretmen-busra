version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: busra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sifre123
      POSTGRES_DB: busra_ogretmen
    ports:
      - "5432:5432"
    volumes:
      - busra_pg_data:/var/lib/postgresql/data

volumes:
  busra_pg_data: